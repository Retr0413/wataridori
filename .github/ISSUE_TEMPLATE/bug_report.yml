name: Bug report
description: Report a reproducible Wataridori defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private repository URLs, production project IDs, or unredacted logs.
        Report security issues privately through the Security Advisory link instead.
  - type: input
    id: version
    attributes:
      label: Wataridori version
      description: Release, commit SHA, or branch.
      placeholder: v0.1.0 or 0123abc
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version, and whether this is CLI or serve.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands and sanitized manifests.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, private URLs, and production identifiers.
          required: true
        - label: This is not a security vulnerability.
          required: true
