name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unpublished tag to build without moving it
        required: true
        type: string
      expected_commit:
        description: Full reviewed commit SHA that the existing tag must resolve to
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
      RELEASE_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify the release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use SemVer, for example v0.1.0 or v0.1.0-rc.1."
            exit 1
          fi
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_COMMIT" ]]
          git fetch origin master
          git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/master
          # Use the pinned workflow revision's packaging configuration while
          # compiling only the unchanged, tagged source tree. This permits a
          # packaging-only repair without deleting or moving an existing tag.
          git show "$RELEASE_WORKFLOW_SHA:.goreleaser.yaml" > "$RUNNER_TEMP/goreleaser.yaml"

      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const {GITHUB_REPOSITORY, RELEASE_TAG, GH_TOKEN} = process.env;
          const response = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}`, {
            headers: {Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json'},
            redirect: 'error', signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`Release lookup failed: HTTP ${response.status}`);
            if (!(await response.json()).draft) throw new Error('Published releases are immutable; use a new version.');
          }
          JS

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --config ${{ runner.temp }}/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
