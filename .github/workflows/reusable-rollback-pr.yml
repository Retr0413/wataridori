name: reusable-wataridori-rollback-pr
on:
  workflow_call:
    inputs:
      wataridori_ref:
        required: true
        type: string
      environment:
        default: prod
        type: string
      service:
        required: true
        type: string
      verified_release_pr:
        description: Previously merged PR with a successful pinned production delivery run
        required: true
        type: number
      github_app_id:
        required: true
        type: string
      admission_app_id:
        default: ''
        type: string
    secrets:
      github_app_private_key:
        required: true
      admission_token:
        description: Read-only token for prior production checks and Actions runs
        required: false
      admission_app_private_key:
        required: false
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.repository }}-wataridori-rollback-${{ inputs.environment }}-${{ inputs.service }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SERVICE: ${{ inputs.service }}
      WATARIDORI_REF: ${{ inputs.wataridori_ref }}
      ROLLBACK_PR: ${{ inputs.verified_release_pr }}
    steps:
      - name: Require explicit request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$WATARIDORI_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$ENVIRONMENT" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$ ]]
          [[ "$SERVICE" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$ ]]
      - name: Mint read-only admission token
        id: admission_token
        if: inputs.admission_app_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.admission_app_id }}
          private-key: ${{ secrets.admission_app_private_key }}
          permission-contents: read
          permission-actions: read
          permission-checks: read
          permission-pull-requests: read
      - name: Create proposal token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.github_app_id }}
          private-key: ${{ secrets.github_app_private_key }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Retr0413/wataridori
          ref: ${{ inputs.wataridori_ref }}
          path: _wataridori-tool
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build pinned CLI
        working-directory: _wataridori-tool
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$WATARIDORI_REF" ]]
          mkdir -p "$RUNNER_TEMP/wataridori-bin"
          go build -o "$RUNNER_TEMP/wataridori-bin/wataridori" ./cmd/wataridori
          echo "$RUNNER_TEMP/wataridori-bin" >> "$GITHUB_PATH"
      - name: Prepare reviewed recovery plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ steps.admission_token.outputs.token || secrets.admission_token }}
          SUMMARY_FILE: ${{ runner.temp }}/rollback.md
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          export ROLLBACK_COMMIT
          ROLLBACK_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ROLLBACK_PR" --jq .merge_commit_sha)"
          base="$(git rev-parse HEAD)"
          branch="wataridori/rollback-$ENVIRONMENT-$SERVICE-$GITHUB_RUN_ID"
          # A retry of the same request must not overwrite an existing reviewed branch.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Rollback branch already exists: $branch. Review its PR or explicitly start a new request." >&2
            exit 1
          fi
          git switch -c "$branch"
          node _wataridori-tool/actions/delivery/run.mjs rollback-prepare
          service_file="$(wataridori delivery snapshot --env "$ENVIRONMENT" --service "$SERVICE" --json | jq -r .file)"
          git add -- "$service_file" ".wataridori/plans/$ENVIRONMENT/$SERVICE.json"
          git -c user.name='wataridori[bot]' -c user.email='wataridori[bot]@users.noreply.github.com' commit -m "rollback($ENVIRONMENT): $SERVICE to verified release #$ROLLBACK_PR"
          git fetch origin "$BASE_BRANCH"
          [[ "$(git rev-parse FETCH_HEAD)" == "$base" ]] || { echo 'base moved; prepare a new recovery plan' >&2; exit 1; }
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open recovery PR for human approval
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE_BRANCH" \
            --title "rollback($ENVIRONMENT): $SERVICE to verified release #$ROLLBACK_PR" \
            --body-file "$RUNNER_TEMP/rollback.md" >> "$GITHUB_STEP_SUMMARY"
