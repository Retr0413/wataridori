name: reusable-wataridori-artifact-event

on:
  workflow_call:
    inputs:
      wataridori_ref:
        description: Full 40-character Wataridori commit SHA to install
        required: true
        type: string
      manifest_owner:
        required: true
        type: string
      manifest_repository:
        required: true
        type: string
      github_app_id:
        required: true
        type: string
      environment:
        required: false
        default: dev
        type: string
      service:
        required: true
        type: string
      image:
        required: true
        type: string
      source_repository:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      workflow_run:
        required: true
        type: string
      expected_base_sha:
        description: Compare-and-swap guard for the manifest branch
        required: true
        type: string
      occurred_at:
        required: false
        default: ""
        type: string
      base_branch:
        required: false
        default: ""
        type: string
      workload_identity_provider:
        required: true
        type: string
      service_account:
        description: Artifact Registry read-only service account
        required: true
        type: string
    secrets:
      github_app_private_key:
        required: true
    outputs:
      changed:
        value: ${{ jobs.deliver.outputs.changed }}
      event_id:
        value: ${{ jobs.deliver.outputs.event_id }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: wataridori-artifact-${{ inputs.manifest_owner }}-${{ inputs.manifest_repository }}-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.event.outputs.changed }}
      event_id: ${{ steps.event.outputs.event_id }}
    steps:
      - name: Create least-privilege repository token
        id: app_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ inputs.github_app_id }}
          private-key: ${{ secrets.github_app_private_key }}
          owner: ${{ inputs.manifest_owner }}
          repositories: ${{ inputs.manifest_repository }}
          permission-contents: write

      - name: Resolve and validate candidate
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPOSITORY: ${{ inputs.manifest_owner }}/${{ inputs.manifest_repository }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          REQUESTED_BASE: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" == "$TARGET_REPOSITORY" ]] || {
            echo "direct Artifact Events require the source and manifest repository to match" >&2
            exit 1
          }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid source commit" >&2; exit 1; }
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid expected base SHA" >&2; exit 1; }
          base="$REQUESTED_BASE"
          if [[ -z "$base" ]]; then
            base="$(gh api "repos/$TARGET_REPOSITORY" --jq .default_branch)"
          fi
          [[ "$base" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "invalid base branch" >&2; exit 1; }
          current="$(gh api "repos/$TARGET_REPOSITORY/commits/$base" --jq .sha)"
          [[ "$current" == "$EXPECTED_BASE_SHA" ]] || {
            echo "stale Artifact Event: expected $EXPECTED_BASE_SHA but $base is $current" >&2
            exit 1
          }
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.manifest_owner }}/${{ inputs.manifest_repository }}
          ref: ${{ steps.target.outputs.base }}
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - name: Enforce event ordering
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_BASE_SHA" ]] || { echo "checkout changed after compare-and-swap" >&2; exit 1; }
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD || { echo "source commit is not an ancestor of the manifest base" >&2; exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: false

      - name: Install pinned Wataridori source
        shell: bash
        env:
          WATARIDORI_REF: ${{ inputs.wataridori_ref }}
        run: |
          set -euo pipefail
          [[ "$WATARIDORI_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "wataridori_ref must be a full commit SHA" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/wataridori-bin"
          GOBIN="$RUNNER_TEMP/wataridori-bin" go install "github.com/Retr0413/wataridori/cmd/wataridori@${WATARIDORI_REF}"
          echo "$RUNNER_TEMP/wataridori-bin" >> "$GITHUB_PATH"

      - name: Authenticate for Artifact Registry verification
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Verify and record Artifact Event
        id: event
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_RUN: ${{ inputs.workflow_run }}
          OCCURRED_AT: ${{ inputs.occurred_at }}
        run: |
          set -euo pipefail
          args=(event image --env "$ENVIRONMENT" --service "$SERVICE" --image "$IMAGE" --source-repository "$SOURCE_REPOSITORY" --source-commit "$SOURCE_COMMIT" --workflow-run "$WORKFLOW_RUN" --max-age 24h --json)
          [[ -z "$OCCURRED_AT" ]] || args+=(--occurred-at "$OCCURRED_AT")
          wataridori "${args[@]}" > "$RUNNER_TEMP/artifact-event.json"
          cat "$RUNNER_TEMP/artifact-event.json"
          {
            echo "changed=$(jq -r .changed "$RUNNER_TEMP/artifact-event.json")"
            echo "event_id=$(jq -r .eventId "$RUNNER_TEMP/artifact-event.json")"
            echo "file=$(jq -r .file "$RUNNER_TEMP/artifact-event.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Commit desired-state update
        if: steps.event.outputs.changed == 'true'
        shell: bash
        env:
          BASE_BRANCH: ${{ steps.target.outputs.base }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          FILE: ${{ steps.event.outputs.file }}
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          EVENT_ID: ${{ steps.event.outputs.event_id }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_RUN: ${{ inputs.workflow_run }}
        run: |
          set -euo pipefail
          git config user.name "wataridori[bot]"
          git config user.email "wataridori[bot]@users.noreply.github.com"
          git add -- "$FILE"
          git commit -m "deploy(${ENVIRONMENT}): update ${SERVICE} digest" -m "Wataridori-Event-ID: ${EVENT_ID}
          Wataridori-Source-Repository: ${SOURCE_REPOSITORY}
          Wataridori-Source-Commit: ${SOURCE_COMMIT}
          Wataridori-Workflow-Run: ${WORKFLOW_RUN}"
          git fetch origin "$BASE_BRANCH"
          [[ "$(git rev-parse FETCH_HEAD)" == "$EXPECTED_BASE_SHA" ]] || { echo "base moved before push; retry with the new expected SHA" >&2; exit 1; }
          git push origin "HEAD:refs/heads/$BASE_BRANCH"
