version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      # Terminal writes: failing stdout/stderr is not actionable.
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint

formatters:
  enable:
    - gofmt
    - goimports
