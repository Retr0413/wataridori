version: 2
project_name: wataridori

git:
  tag_sort: smartsemver

builds:
  - main: ./cmd/wataridori
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Retr0413/wataridori/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

kos:
  - repositories:
      - ghcr.io/retr0413/wataridori
    tags:
      - "{{ .Version }}"
    bare: true
    base_image: gcr.io/distroless/static:nonroot
    platforms:
      - linux/amd64
      - linux/arm64
    disable: "{{ .IsSnapshot }}"

sboms:
  - artifacts: archive
    disable: false

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  draft: true
  prerelease: auto
  include_meta: true
