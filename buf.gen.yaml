version: v2
managed:
  enabled: true
  override:
    # Generated Go lands under gen/, importable as
    # github.com/Retr0413/wataridori/gen/wataridori/v1.
    - file_option: go_package_prefix
      value: github.com/Retr0413/wataridori/gen
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  # Generated TypeScript lands in web/src/gen. protobuf-es v2 emits the
  # service descriptors too, so connect-web needs no second plugin.
  # The binary comes from web/node_modules, so run `npm --prefix web ci`
  # (or `make tools`) before `buf generate`.
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
